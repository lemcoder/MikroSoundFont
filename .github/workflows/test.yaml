name: Test
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Android NDK
        # Runners preset ANDROID_NDK_HOME to an older NDK, which KonanPlugin prefers over the Android
        # Gradle plugin's; point it at NDK 28, whose linker aligns to 16 KB pages by default.
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      # The shared tests (src/commonTest) built for linuxX64 and run natively: same TinySoundFont
      # and stb_vorbis code as every other target, without an Android emulator.
      - name: Run tests
        run: ./gradlew :soundfont:linuxX64Test

      - name: Check 16 KB page alignment
        run: |
          ./gradlew :soundfont:bundleAndroidMainAar
          scripts/check-16kb-alignment.sh soundfont/build/outputs/aar/soundfont.aar

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: soundfont/build/reports/tests/
